name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run linting
        run: chmod +x ./scripts/lint.sh && ./scripts/lint.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Make test script executable
        run: chmod +x ./tests/test.sh

      - name: Run tests
        run: ./tests/test.sh

  docker:
    name: Docker Build and Smoke Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Run Docker build and smoke tests
        run: chmod +x ./scripts/build.sh && ./scripts/build.sh
